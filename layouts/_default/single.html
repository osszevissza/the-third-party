{{ define "main" }}
<article class="page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- with .Params.subtitle }}
    <p class="subtitle">{{ . }}</p>
    {{- end }}
    {{- with .Params.status_as_of }}
    <p class="status-as-of">Status as of {{ . }}</p>
    {{- end }}
  </header>
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
