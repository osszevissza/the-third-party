- id: edpb-cookie-banner-taskforce
  title: "Report of the work undertaken by the Cookie Banner Taskforce"
  authors: ["European Data Protection Board"]
  publisher: European Data Protection Board
  date: 2023-01-17
  type: regulator
  url: https://www.edpb.europa.eu/our-work-tools/our-documents/other/report-work-undertaken-cookie-banner-taskforce_en
  archive: http://web.archive.org/web/20260615211551/https://www.edpb.europa.eu/our-work-tools/our-documents/other/report-work-undertaken-cookie-banner-taskforce_en
  verified_on: 2026-10-14   # landing page HTTP 200, and the 8-page PDF read in full
  weakness: >
    The report says itself that its positions are a minimum common denominator agreed
    between supervisory authorities, are not standalone findings, and do not prejudge
    any individual complaint. It is a coordination record, not a ruling, and it concerns
    the banner designs complained about by one complainant rather than banners in
    general. Colour and contrast questions are explicitly left to case-by-case review.
  supports:
    - Supervisory authorities met thirteen times to coordinate on cookie banner complaints.
    - The absence of a reject option on the layer carrying a consent button was held by a vast majority of authorities to infringe the consent standard.
    - Pre-ticked boxes to opt in do not produce valid consent.
    - Reject offered only as a link inside a paragraph, or outside the banner, does not produce valid consent without sufficient visual support.
    - A reject button whose text is unreadable against its own background was treated as manifestly misleading.
    - Legitimate interests cannot be the legal basis for placing or reading cookies.
    - Cookies classified as essential when they are not is a recognised problem.

- id: cjeu-iab-europe-tcf
  title: "Press release No 44/24: Judgment of the Court in Case C-604/22, IAB Europe"
  authors: ["Court of Justice of the European Union"]
  publisher: Court of Justice of the European Union
  date: 2024-03-07
  type: judgment
  url: https://curia.europa.eu/jcms/upload/docs/application/pdf/2024-03/cp240044en.pdf
  archive: http://web.archive.org/web/20251101015834/https://curia.europa.eu/jcms/upload/docs/application/pdf/2024-03/cp240044en.pdf
  verified_on: 2026-10-14   # PDF downloaded from curia.europa.eu and read in full
  weakness: >
    This is the court's own press release, not the judgment, and it carries the court's
    disclaimer that it is an unofficial document for media use and not binding. Use it
    for the shape of the holdings, not for the court's reasoning, and replace it with the
    judgment text (Case C-604/22, ECLI:EU:C:2024:214) once a stable full-text link is
    confirmed. The full judgment was not retrievable from a terminal: EUR-Lex serves a
    JavaScript challenge instead of the document and curia.europa.eu serves a script
    shell, so neither could be read here. The proceedings remain live before the
    referring court on the points the Court left to it.
  supports:
    - A Transparency and Consent String encodes a user's consent choices and is shared across the advertising system.
    - The Court held that a TC String constitutes personal data.
    - Combined with an identifier such as an IP address, a TC String can be used to profile and identify a user.
    - IAB Europe was held to be a joint controller for the recording of consent choices in a TC String.
    - The Court did not treat IAB Europe as controller of the processing that happens after that recording unless it influenced those purposes and means.

- id: conseil-etat-yahoo-cookies
  title: "Conseil d'État, 10ème et 9ème chambres réunies, 7 October 2025, No 494300 (Yahoo EMEA Limited)"
  authors: ["Conseil d'État"]
  publisher: Conseil d'État (France)
  date: 2025-10-07
  type: judgment
  url: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-10-07/494300
  archive: http://web.archive.org/web/20260615104518/https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2025-10-07/494300
  verified_on: 2026-10-14   # decision page HTTP 200 and read in full
  weakness: >
    French, and in French. It is a ruling on one company and largely on questions of the
    regulator's competence and procedure rather than on what a good banner looks like.
    The underlying sanction is a national transposition of the ePrivacy rules, so the
    amounts and the procedural findings do not transfer to other jurisdictions. The
    decision was read here in French and its reasoning is described rather than quoted.
  supports:
    - The CNIL fined Yahoo EMEA 10 million euros over cookie advertising without prior consent and over the means of withdrawing consent.
    - The Conseil d'État upheld the finding that users faced an obstacle to withdrawing consent.
    - The Conseil d'État held that the CNIL can act on cookie rules even where the operation is not processing of personal data.
    - Consent can be expressed through settings of the user's device or another device under the user's control.

