- id: eckersley-fingerprinting
  title: "How Unique Is Your Web Browser?"
  authors: ["Peter Eckersley"]
  publisher: "Privacy Enhancing Technologies (PETS) 2010, Springer"
  date: 2010
  type: research
  url: https://dl.acm.org/doi/abs/10.5555/1881151.1881152
  archive: null   # no Wayback snapshot found on 2026-10-14
  verified_on: null   # NOT VERIFIED: dl.acm.org returns 403 for ANY path, so the code proves nothing. Open by hand.
  weakness: >
    Sixteen years old, and the specific uniqueness rates are a property of browsers
    that had Flash or Java installed. The MECHANISM is the durable finding and is
    what this site relies on; do not quote the percentage as current.
  supports:
    - Browser configuration alone can single out a visitor without stored state.
    - Fingerprinting defeats cookie deletion by design.

- id: eff-cover-your-tracks
  title: "Cover Your Tracks"
  authors: ["Electronic Frontier Foundation"]
  publisher: Electronic Frontier Foundation
  date: null
  type: tool
  url: https://coveryourtracks.eff.org/
  archive: http://web.archive.org/web/20261013235610/https://coveryourtracks.eff.org/
  verified_on: 2026-10-13   # HTTP 200 via scripts/check-links.py
  weakness: >
    A measurement tool, not a study. It reports what your browser exposes at the
    moment you run it, which can vary between runs and does not by itself prove
    that any particular site is fingerprinting you.
  supports:
    - Lets a reader measure their own fingerprint instead of trusting a claim.
    - Demonstrates what survives opening a private window.

