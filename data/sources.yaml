- id: swd-emissions-model
  title: "Estimating Digital Emissions"
  authors: ["Sustainable Web Design"]
  publisher: Sustainable Web Design
  date: null         # the page is undated; it describes the model's current version
  type: methodology
  url: https://sustainablewebdesign.org/estimating-digital-emissions/
  archive: http://web.archive.org/web/20261014182609/https://sustainablewebdesign.org/estimating-digital-emissions/
  verified_on: 2026-10-14   # control-probed: a bogus path on the same host returns 404 with 31088 bytes against this page's 200 with 82900, and the archived copy was fetched and read, and carries the energy intensities used on /receipts/
  weakness: >
    A model rather than a measurement, and its inputs are global averages. The energy
    intensities come from industry-wide totals, and its default grid intensity of 494
    gCO2e/kWh is a world average that the page itself tells you to replace with your own.
    Any figure derived from it is an estimate. This site derives one on /receipts/ and
    labels it as an estimate for exactly that reason.
  supports:
    - Website emissions can be estimated from bytes transferred, energy intensity per gigabyte and grid carbon intensity.
    - The model's default grid intensity is 494 gCO2e per kWh, the global average for electricity.
    - Its energy intensities total 0.300 kWh per gigabyte across data centres, networks and user devices, operational and embodied combined.
    - Roughly a third of the modelled total is embodied emissions, from manufacturing devices and networks rather than from running them.
