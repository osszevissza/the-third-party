- id: ccpa-sale-definition
  title: "California Consumer Privacy Act: definition of 'sale', Cal. Civ. Code § 1798.140(ad)"
  authors: ["State of California"]
  publisher: California Legislative Information
  date: 2018
  type: statute
  url: https://california.public.law/codes/civil_code_section_1798.140
  archive: http://web.archive.org/web/20260710111344/https://california.public.law/codes/civil_code_section_1798.140
  verified_on: 2026-10-13   # third-party mirror of the current text; leginfo is official
  weakness: >
    California only, and the operative definition has been amended more than once
    since enactment. The precise subsection number should be confirmed against the
    current text before publication, as it has moved.
  supports:
    - The word sale is defined more broadly than an exchange of money.
    - Sharing for cross-context behavioural advertising can fall within it.

- id: cjeu-planet49
  title: "Bundesverband der Verbraucherzentralen v Planet49 GmbH, Case C-673/17"
  authors: ["Court of Justice of the European Union"]
  publisher: Court of Justice of the European Union
  date: 2019-10-01
  type: judgment
  url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62017CJ0673
  archive: http://web.archive.org/web/20260624151027/https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A62017CJ0673
  verified_on: 2026-10-13   # EUR-Lex record for CELEX 62017CJ0673
  weakness: >
    Concerns cookies and consent under the ePrivacy Directive and GDPR as they stood
    at the time. The holding on pre-ticked boxes is settled; its application to newer
    banner designs is inference, not holding.
  supports:
    - A pre-ticked checkbox is not valid consent; consent needs an active act.
    - Consent must be specific and informed to be valid.

- id: edpb-consent-or-pay
  title: "Opinion 08/2024 on Valid Consent in the Context of Consent or Pay Models Implemented by Large Online Platforms"
  authors: ["European Data Protection Board"]
  publisher: European Data Protection Board
  date: 2024-04-17
  type: regulator
  url: https://www.edpb.europa.eu/documents/opinion-of-the-board-art-64/opinion-082024-on-valid-consent-in-the-context-of-consent-or_en
  archive: http://web.archive.org/web/20261014174517/https://www.edpb.europa.eu/documents/opinion-of-the-board-art-64/opinion-082024-on-valid-consent-in-the-context-of-consent-or_en
  verified_on: 2026-10-14   # NOT a status code: this host answers 200 for paths that cannot exist
                            # (a bogus sibling document path returned 200 with 94043 bytes, larger
                            # than the real page's 44610). Verified by content instead: the page's
                            # own title is the opinion's title, the linked PDF is 42 pages and says
                            # "Adopted on 17 April 2024", and a bogus file path under /system/files/
                            # correctly returns 404, so the file server does control-probe.
  weakness: >
    An advisory opinion, not binding law, and explicitly framed around LARGE online
    platforms rather than all sites. Do not present it as a general rule for every
    consent-or-pay banner. A corrigendum of October 2024 makes editorial corrections to
    paragraphs 49 and 60 and footnotes 14, 24, 50, 76 and 131, so any passage quoted or
    paraphrased from the opinion should be checked against the corrected text.
  supports:
    - Whether "consent or pay" is freely given is contested at EU level.
    - Regulators treat banner design as a consent-validity question.

- id: themarkup-blacklight
  title: "Blacklight"
  authors: ["The Markup"]
  publisher: The Markup
  date: null
