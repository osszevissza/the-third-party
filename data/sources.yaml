# data/sources.yaml
#
# Single source of truth for every citation on the site.
# Pages reference these by `id` in their frontmatter; the `cite` shortcode renders
# inline numbered links and /sources/ builds the bibliography and reverse index.
#
# FIELD NOTES
#   verified_on: the date the URL was last confirmed to resolve. Run
#                `python3 scripts/check-links.py` to re-check every URL in this file.
#                `null` means the link is unverified and must NOT be published live.
#                Several domains here (ftc.gov, nytimes.com, acm.org, reuters.com,
#                lexology.com, loc.gov) answer automated requests with 403/404 while
#                working normally in a browser. The checker detects this by also
#                probing the domain root, but a "blocked" result still means a human
#                should open the page once and confirm the content matches the claim.
#   archive:     Wayback Machine snapshot. Fill these in as you verify: privacy
#                policies, pricing pages and press releases change or vanish, which
#                is the exact problem this site is about.
#   weakness:    what this source is bad at. Every source has one. Recording it is
#                the difference between a bibliography and a decoration.

- id: aol-4417749
  title: "A Face Is Exposed for AOL Searcher No. 4417749"
  authors: ["Michael Barbaro", "Tom Zeller Jr."]
  publisher: The New York Times
  date: 2006-08-09
  type: news
  url: https://www.nytimes.com/2006/08/10/learning/featuredarticle/20060810thursday.html
  archive: http://web.archive.org/web/20240603055457/https://www.nytimes.com/2006/08/10/learning/featuredarticle/20060810thursday.html
  verified_on: null   # NOT VERIFIED: nytimes.com returns 403 for ANY path, so the code proves nothing. Open by hand.
  weakness: >
    Contemporary journalism, not research. It documents the re-identification
    convincingly, but the ~658,000-user and ~20-million-query figures come from
    AOL's own withdrawn release and are reported second-hand here.
  supports:
    - Aggregation harms require no breach or malice.
    - Pseudonymised data is re-identifiable from content alone.

- id: sweeney-demographics
  title: "Simple Demographics Often Identify People Uniquely"
  authors: ["Latanya Sweeney"]
  publisher: Carnegie Mellon University, Data Privacy Working Paper 3
  date: 2000
  type: research
  url: https://kilthub.cmu.edu/articles/journal_contribution/Simple_Demographics_Often_Identify_People_Uniquely/6625769
  archive: http://web.archive.org/web/20251216173239/https://kilthub.cmu.edu/articles/journal_contribution/Simple_Demographics_Often_Identify_People_Uniquely/6625769
  verified_on: 2026-10-13
  weakness: >
    2000 US census data. The precise 87% figure is a property of that population
    and that era, and should be presented as an illustration of the mechanism
    rather than as a current statistic.
  supports:
    - 87% of the US population likely identifiable from ZIP + birth date + sex.
    - Anonymity by field-deletion is not anonymity.

- id: netflix-prize
  title: "How to Break Anonymity of the Netflix Prize Dataset (FAQ)"
  authors: ["Arvind Narayanan", "Vitaly Shmatikov"]
  publisher: Cornell University / IEEE Symposium on Security and Privacy 2008
  date: 2008
  type: research
  url: https://www.cs.cornell.edu/~shmat/netflix-faq.html
  archive: null   # no Wayback snapshot found on 2026-10-14
  verified_on: 2026-10-13
  weakness: >
    The link is the authors' plain-language FAQ, not the peer-reviewed paper
    ("Robust De-anonymization of Large Sparse Datasets"). Cite the paper for the
    method; use this for readers who want the intuition.
  supports:
    - Cross-referencing an "anonymous" dataset against an unrelated public one
      breaks anonymity.
    - The join, not the record, is where the harm lives.

- id: solove-nothing-to-hide
  title: "\"I've Got Nothing to Hide\" and Other Misunderstandings of Privacy"
  authors: ["Daniel J. Solove"]
  publisher: San Diego Law Review, vol. 44, no. 4, p. 745
  date: 2007
  type: law-review
  url: https://digital.sandiego.edu/sdlr/vol44/iss4/5/
  archive: http://web.archive.org/web/20260519004224/https://digital.sandiego.edu/sdlr/vol44/iss4/5/
  verified_on: 2026-10-13
  weakness: >
    A normative argument, not empirical evidence. It is the best available answer
    to the "nothing to hide" claim, but it does not by itself demonstrate that any
    particular harm occurs.
  supports:
    - Privacy is a family of concerns, not a synonym for secrecy.
    - The "nothing to hide" argument answers a question nobody asked.

- id: solove-taxonomy
  title: "A Taxonomy of Privacy"
  authors: ["Daniel J. Solove"]
  publisher: University of Pennsylvania Law Review, vol. 154, p. 477
  date: 2006
  type: law-review
  url: null          # URL NOT YET VERIFIED; do not publish a link until checked
  archive: null
  verified_on: null
  weakness: >
    A taxonomy, not a measurement. Useful for organising harms precisely; it
    provides no evidence about how often any of them occur.
  supports:
    - Harms of collection, processing, dissemination and intrusion are distinct.
    - Aggregation, secondary use and exclusion are three distinct named harms.

- id: ali-ad-delivery
  title: "Discrimination through Optimization: How Facebook's Ad Delivery Can Lead to Biased Outcomes"
  authors: ["Muhammad Ali", "Piotr Sapiezynski", "Miranda Bogen", "Aleksandra Korolova", "Alan Mislove", "Aaron Rieke"]
  publisher: "Proceedings of the ACM on Human-Computer Interaction, vol. 3, CSCW"
  date: 2019-11
  type: research
  doi: 10.1145/3359301
  url: https://dl.acm.org/doi/10.1145/3359301
  archive: http://web.archive.org/web/20250106222952/https://dl.acm.org/doi/10.1145/3359301
  verified_on: null   # NOT VERIFIED: dl.acm.org returns 403 for ANY path, so the code proves nothing. Open by hand.
  weakness: >
    Facebook's ad system has changed substantially since 2019. The finding (that
    optimisation produces skewed delivery from neutral targeting) is the durable
    part; the specific measured skews are historical.
  supports:
    - Identical targeting inputs produce systematically different delivery by race
      and gender.
    - Not everyone is seen equally, so "being seen" is not a uniform cost.

