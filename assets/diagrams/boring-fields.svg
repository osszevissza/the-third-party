<svg viewBox="0 0 660 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-title d3-desc" font-family="'General Sans', system-ui, sans-serif">
  <title id="d3-title">Three ordinary fields, joined, become a decision about you</title>
  <desc id="d3-desc">Three boxes holding a five digit ZIP code, a date of birth and sex
    converge on a box reading lined up together, where 87% of the US population can be
    singled out. An arrow leads to a pink box reading a decision about you: credit,
    price, housing. A closing note says the join is the step you cannot see or consent
    to in advance, and that a file can be lined up against datasets that do not exist
    yet when you agree to the first one.</desc>

  <text x="0" y="20" class="d-small d-ink-muted">each field, alone: boring</text>

  <rect x="0" y="30" width="170" height="28" rx="5" class="d-box"/>
  <text x="12" y="49" class="d-small">five-digit ZIP code</text>

  <rect x="0" y="64" width="170" height="28" rx="5" class="d-box"/>
  <text x="12" y="83" class="d-small">date of birth</text>

  <rect x="0" y="98" width="170" height="28" rx="5" class="d-box"/>
  <text x="12" y="117" class="d-small">sex</text>

  <!-- The three fields converge, then the join, then the outcome. -->
  <path d="M170 44 L215 44 L215 96 L231 96" class="d-line"/>
  <path d="M170 78 L215 78 L215 96" class="d-line"/>
  <path d="M170 112 L215 112 L215 96" class="d-line"/>
  <polygon points="240,96 231,92 231,100" class="d-arrow"/>

  <rect x="240" y="64" width="190" height="64" rx="6" class="d-box d-box--accent d-flash" style="--d:1.45s"/>
  <text x="335" y="84" class="d-label d-label--on-accent" text-anchor="middle">lined up together</text>
  <text x="335" y="104" class="d-small d-label--on-accent" text-anchor="middle">87% of the US population</text>
  <text x="335" y="120" class="d-small d-label--on-accent" text-anchor="middle">can be singled out</text>

  <line x1="430" y1="96" x2="500" y2="96" class="d-line"/>
  <polygon points="500,96 491,92 491,100" class="d-arrow"/>

  <rect x="500" y="64" width="160" height="64" rx="6" class="d-box d-box--pop d-flash" style="--d:2.65s"/>
  <text x="580" y="86" class="d-label d-label--on-pop" text-anchor="middle">a decision</text>
  <text x="580" y="104" class="d-label d-label--on-pop" text-anchor="middle">about you</text>
  <text x="580" y="122" class="d-small d-label--on-pop" text-anchor="middle">credit, price, housing</text>

  <text x="0" y="172" class="d-small d-ink-muted">The join is the step you cannot see or consent to in advance: a file can be</text>
  <text x="0" y="189" class="d-small d-ink-muted">lined up against datasets that do not exist yet when you agree to the first one.</text>

  <!-- Flow packets, painted by CSS. The three converging routes carry one packet each,
       the accent box lights as they land, and a later packet crosses the join. -->
  <g aria-hidden="true">
    <path d="M170 44 L215 44 L215 96 L231 96" pathLength="100" class="d-packet" style="--d:0s"/>
    <path d="M170 78 L215 78 L215 96" pathLength="100" class="d-packet" style="--d:.2s"/>
    <path d="M170 112 L215 112 L215 96" pathLength="100" class="d-packet" style="--d:.4s"/>
    <path d="M430 96 L500 96" pathLength="100" class="d-packet" style="--d:1.6s"/>
  </g>
</svg>
